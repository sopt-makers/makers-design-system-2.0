name: Update Design Tokens

on:
  repository_dispatch:
    types: [update-design-tokens]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-design-tokens
  cancel-in-progress: true

jobs:
  sync:
    name: Sync design tokens
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22
          pnpm-version: 10.26.2

      - name: Write token payload
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const payload = context.payload.client_payload;
            if (!payload || typeof payload !== "object") {
              core.setFailed("client_payload 가 비어 있습니다. token.json 형태의 body를 전달하세요.");
              return;
            }
            if (!payload.base && !payload.semantic) {
              core.setFailed("client_payload 에 base/semantic 토큰셋이 없습니다.");
              return;
            }
            fs.writeFileSync("token.json", `${JSON.stringify(payload, null, 2)}\n`, "utf8");
            core.info("token.json 을 client_payload 로 갱신했습니다.");

      # update-spec이 존재하는지 확인
      - name: Ensure update-spec
        run: |
          if [ ! -f .sync-design-tokens/update-spec.json ]; then
            echo "::error::.sync-design-tokens/update-spec.json 이 없습니다."
            echo "sync-design-tokens 스킬로 token.json 을 해석해 update-spec 을 생성한 뒤 다시 실행하세요."
            exit 1
          fi

      # update-spec.json으로 design-tokens를 업데이트
      # tokens:sync 스크립트는 CI Only에요. 개발자가 직접 트리거할 일은 없어요
      - name: Apply update-spec
        id: sync
        run: |
          pnpm tokens:sync --spec .sync-design-tokens/update-spec.json

          if git diff --quiet -- packages/design-tokens/src token.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "토큰 변경 없음"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "토큰 변경 감지"
            git diff --stat
          fi

      - name: Create changeset
        if: steps.sync.outputs.changed == 'true'
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          fs.writeFileSync(
            ".changeset/figma-design-tokens-sync.md",
            [
              "---",
              '"@sopt-mds/design-tokens": patch',
              "---",
              "",
              "Figma 토큰 동기화로 design tokens를 업데이트합니다.",
              "",
            ].join("\n"),
            "utf8",
          );
          NODE

      - name: Create Pull Request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(design-tokens): sync tokens from Figma"
          branch: chore/update-design-tokens
          delete-branch: true
          title: "chore(design-tokens): Figma 토큰 동기화"
          body: |
            ## 요약
            - Figma payload(`token.json`)를 에이전트가 update-spec으로 해석한 뒤 design-tokens에 반영했습니다.

            ## 트리거
            - actor: `${{ github.actor }}`
          labels: |
            design-tokens
            automated
