name: Changeset Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: changeset-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changeset:
    name: changeset 존재 확인
    runs-on: ubuntu-latest
    # Version Packages(릴리즈) PR은 changeset을 소비하므로 검사에서 제외
    if: github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: changeset 확인
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # 퍼블리시 대상(packages/**)을 변경했는지
          pkg_changed=$(git diff --name-only "$BASE"..."$HEAD" -- packages)
          # 새로 추가된 changeset(.md, README/config 제외)이 있는지
          cs_added=$(git diff --name-only --diff-filter=A "$BASE"..."$HEAD" -- .changeset \
            | grep -E '\.md$' | grep -v 'README\.md' || true)

          if [ -z "$pkg_changed" ]; then
            echo "✅ packages/** 변경 없음 → changeset 불필요"
            exit 0
          fi

          if [ -n "$cs_added" ]; then
            echo "✅ changeset 발견:"
            echo "$cs_added"
            exit 0
          fi

          echo "::error title=changeset 누락::packages/** 를 변경했는데 changeset이 없습니다. \`pnpm changeset\` 으로 추가해 주세요. (없으면 Version Packages PR이 생성되지 않아 npm 릴리즈가 누락됩니다.)"
          exit 1
